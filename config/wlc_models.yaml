# AireOS controller and access point lifecycle facts for the Cisco WLC report.
#
# max_aireos: last AireOS release the hardware runs.
# c9800:      whether the AP can join a Catalyst 9800 controller
#             ("Yes", "Up to 17.3", "No"); controllers are replaced, not migrated.
# wifi:       Wi-Fi generation.
#
# Values follow Cisco's published compatibility matrices as of 2026. Check them
# against the current matrix before an assessment and edit here; nothing in the
# code needs to change. Lookups match the longest key that prefixes the model:
# controllers by PID, APs by the four-digit series (2602 -> 2600, 1142 -> 1140).

